name: CI

# Compila, roda os testes unitários e os de integração (Testcontainers + PostgreSQL)
# e confere a cobertura mínima de 80% do JaCoCo a cada push e pull request.
on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  build:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify (testes unitários, de integração e cobertura)
        run: |
          set -o pipefail
          ./mvnw -B -ntp verify 2>&1 | tee build.log

      # Em caso de falha, publica as linhas de erro do Maven como anotações do check run,
      # para que apareçam direto na aba Checks do GitHub sem abrir o log inteiro.
      - name: Anotar erros do build
        if: failure()
        run: |
          grep -E '\[ERROR\]|FAILURE|Tests run:.*(Failures: [1-9]|Errors: [1-9])|expected|but was|Exception' build.log \
            | grep -v 'Re-run Maven\|Help 1\|full stack trace\|-e switch\|-X switch\|For more information\|http://cwiki' \
            | head -400 > errors.txt || true
          split -l 40 errors.txt part_
          for f in $(ls part_* 2>/dev/null | head -10); do
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Build ($f)::${msg}"
          done

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            cov=$(awk -F, 'NR>1 {missed+=$8; covered+=$9} END {printf "%.1f", 100*covered/(missed+covered)}' target/site/jacoco/jacoco.csv)
            echo "### Cobertura de linhas: ${cov}%" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Cobertura::Cobertura de linhas: ${cov}%"
          fi
          for kind in surefire failsafe; do
            if ls target/$kind-reports/*.xml >/dev/null 2>&1; then
              tests=$(cat target/$kind-reports/TEST-*.xml | grep -o '<testsuite [^>]*' | grep -o ' tests="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ | bc)
              skipped=$(cat target/$kind-reports/TEST-*.xml | grep -o '<testsuite [^>]*' | grep -o ' skipped="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ | bc)
              echo "::notice title=Testes ($kind)::${tests} testes, ${skipped} ignorados"
            fi
          done

      - name: Relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore
