name: CI

# Compila, roda os testes unitários e os de integração (Testcontainers + PostgreSQL)
# e confere a cobertura mínima de 80% do JaCoCo a cada push e pull request.
on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  build:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify (testes unitários, de integração e cobertura)
        run: ./mvnw -B -ntp verify

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {missed+=$8; covered+=$9} END {printf "### Cobertura de linhas: %.1f%%\n", 100*covered/(missed+covered)}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore
