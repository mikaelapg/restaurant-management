name: CI

# Compila, roda os testes unitários e os de integração (Testcontainers + PostgreSQL)
# e confere a cobertura mínima de 80% do JaCoCo a cada push e pull request.
on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  build:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify (testes unitários, de integração e cobertura)
        run: |
          set -o pipefail
          ./mvnw -B -ntp verify 2>&1 | tee build.log

      # Em caso de falha, publica as linhas de erro do Maven como anotações do check run,
      # para que apareçam direto na aba Checks do GitHub sem abrir o log inteiro.
      - name: Anotar erros do build
        if: failure()
        run: |
          grep -E '\[ERROR\]|FAILURE|Tests run:.*(Failures: [1-9]|Errors: [1-9])|expected|but was|Exception' build.log \
            | grep -v 'Re-run Maven\|Help 1\|full stack trace\|-e switch\|-X switch\|For more information\|http://cwiki' \
            | head -400 > errors.txt || true
          split -l 40 errors.txt part_
          for f in $(ls part_* 2>/dev/null | head -10); do
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Build ($f)::${msg}"
          done

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            cov=$(awk -F, 'NR>1 {missed+=$8; covered+=$9} END {printf "%.1f", 100*covered/(missed+covered)}' target/site/jacoco/jacoco.csv)
            echo "### Cobertura de linhas: ${cov}%" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Cobertura::Cobertura de linhas: ${cov}%"
          fi
          for kind in surefire failsafe; do
            if ls target/$kind-reports/*.xml >/dev/null 2>&1; then
              tests=$(cat target/$kind-reports/TEST-*.xml | grep -o '<testsuite [^>]*' | grep -o ' tests="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ | bc)
              skipped=$(cat target/$kind-reports/TEST-*.xml | grep -o '<testsuite [^>]*' | grep -o ' skipped="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ | bc)
              echo "::notice title=Testes ($kind)::${tests} testes, ${skipped} ignorados"
            fi
          done

      - name: Relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore

  e2e:
    name: Docker Compose + coleção Postman
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # O mesmo caminho do README: sobe a aplicação e o PostgreSQL com o docker-compose.yml.
      - name: Sobe aplicação e banco com Docker Compose
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Espera a API responder
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api-docs > /dev/null; then echo "API no ar"; exit 0; fi
            sleep 5
          done
          echo "::error title=API não subiu::A aplicação não respondeu em 5 minutos"
          exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Roda a coleção inteira, na ordem das pastas, contra a API em Docker.
      - name: Roda a coleção Postman com Newman
        run: |
          npx -y newman@6 run postman/restaurant-management.postman_collection.json \
            --reporters cli,json --reporter-json-export newman.json

      - name: Resumo do Newman
        if: always()
        run: |
          if [ -f newman.json ]; then
            python3 - <<'PY'
          import json
          run = json.load(open("newman.json"))["run"]
          s = run["stats"]
          print(f"::notice title=Postman::{s['requests']['total']} requisições, "
                f"{s['assertions']['total']} asserções, {s['assertions']['failed']} falhas")
          for f in run["failures"][:30]:
              name = f.get("source", {}).get("name", "?")
              msg = f.get("error", {}).get("message", "").replace("\n", " ")
              print(f"::error title=Postman: {name}::{msg}")
          PY
          fi

      - name: Logs da aplicação
        if: failure()
        run: |
          docker compose logs app | grep -E 'ERROR|Exception|Caused by' | head -40 \
            | while read -r line; do echo "::error title=Log da aplicação::${line}"; done

      - name: Derruba os containers
        if: always()
        run: docker compose down -v
